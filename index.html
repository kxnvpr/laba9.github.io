<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Гра "21"</title>
  <style>
    body {
      background-color: #0d0d0d;
      color: #e0e0e0;
      font-family: "Segoe UI", Arial, sans-serif;
      text-align: center;
      margin: 0;
      padding: 0;
    }

    h1 {
      margin-top: 20px;
      color: #00e676;
      text-shadow: 0 0 10px #00e676;
    }

    .container {
      display: flex;
      justify-content: space-around;
      align-items: center;
      flex-wrap: wrap;
      margin-top: 30px;
    }

    .player {
      background: #1a1a1a;
      border-radius: 15px;
      padding: 20px;
      width: 220px;
      box-shadow: 0 0 15px rgba(0, 255, 136, 0.3);
    }

    .score {
      background: #263238;
      color: #00e676;
      padding: 10px;
      border-radius: 8px;
      width: 60px;
      margin: 0 auto 10px;
      font-weight: bold;
    }

    .card {
      width: 120px;
      height: 180px;
      background: #fff;
      border-radius: 12px;
      margin: 10px auto;
      box-shadow: 0 0 15px rgba(0,0,0,0.8);
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      color: black;
      transition: transform 0.4s ease, box-shadow 0.3s ease;
    }

    .card:hover {
      transform: scale(1.05);
      box-shadow: 0 0 25px rgba(0, 255, 136, 0.6);
    }

    .suit-red { color: red; }
    .suit-black { color: black; }

    .corner {
      position: absolute;
      font-weight: bold;
      font-size: 20px;
      line-height: 1.1;
    }

    .top-left {
      top: 8px;
      left: 8px;
      text-align: left;
    }

    .bottom-right {
      bottom: 8px;
      right: 8px;
      text-align: right;
      transform: rotate(180deg);
    }

    .suit-center {
      font-size: 40px;
    }

    #generate {
      background-color: #00e676;
      color: #000;
      border: none;
      padding: 15px 30px;
      border-radius: 10px;
      font-size: 20px;
      cursor: pointer;
      margin: 20px auto;
      display: block;
      font-weight: bold;
      box-shadow: 0 0 15px rgba(0,255,136,0.4);
    }

    #generate:hover {
      background-color: #00ff88;
      box-shadow: 0 0 25px rgba(0,255,136,0.7);
    }

    #result {
      margin-top: 20px;
      font-size: 22px;
      font-weight: bold;
    }

    @media (max-width: 600px) {
      .container {
        flex-direction: column;
      }
      .player {
        width: 90%;
        margin-bottom: 20px;
      }
    }
  </style>
</head>
<body>
  <h1>Гра "21"</h1>
  <p id="attempt">Спроба 1 з 3</p>

  <div class="container">
    <div class="player" id="user">
      <h2 id="username">User</h2>
      <div class="score" id="userScore">0</div>
      <div id="userCard" class="card"></div>
    </div>

    <div class="player" id="computer">
      <h2>Комп’ютер</h2>
      <div class="score" id="compScore">0</div>
      <div id="compCard" class="card"></div>
    </div>
  </div>

  <button id="generate">Generate</button>
  <h2 id="result"></h2>

  <script>
    const cards = [
      {name: '6', value: 6}, {name: '7', value: 7},
      {name: '8', value: 8}, {name: '9', value: 9},
      {name: '10', value: 10}, {name: 'В', value: 2},
      {name: 'Д', value: 3}, {name: 'К', value: 4},
      {name: 'Т', value: 11}
    ];
    const suits = ['♠', '♥', '♦', '♣'];

    let userName = prompt("Введіть ваше ім’я:");
    if (!userName || userName.trim() === "") {
      userName = "User";
    }
    document.getElementById('username').textContent = userName;

    let userTotal = 0;
    let compTotal = 0;
    let attempt = 1;

    const userCardElem = document.getElementById('userCard');
    const compCardElem = document.getElementById('compCard');
    const userScoreElem = document.getElementById('userScore');
    const compScoreElem = document.getElementById('compScore');
    const resultElem = document.getElementById('result');
    const attemptLabel = document.getElementById('attempt');
    const btn = document.getElementById('generate');

    function createCardHTML(card, suit) {
      const isRed = suit === '♥' || suit === '♦';
      const colorClass = isRed ? 'suit-red' : 'suit-black';
      return `
        <div class="corner top-left ${colorClass}">
          ${card.name}<br>${suit}
        </div>
        <div class="suit-center ${colorClass}">${suit}</div>
        <div class="corner bottom-right ${colorClass}">
          ${card.name}<br>${suit}
        </div>
      `;
    }

    btn.addEventListener('click', () => {
      if (attempt > 3) return;

      const userCard = cards[Math.floor(Math.random() * cards.length)];
      const userSuit = suits[Math.floor(Math.random() * suits.length)];
      const compCard = cards[Math.floor(Math.random() * cards.length)];
      const compSuit = suits[Math.floor(Math.random() * suits.length)];

      userCardElem.innerHTML = createCardHTML(userCard, userSuit);
      compCardElem.innerHTML = createCardHTML(compCard, compSuit);

      userTotal += userCard.value;
      compTotal += compCard.value;

      userScoreElem.textContent = userTotal;
      compScoreElem.textContent = compTotal;

      attemptLabel.textContent = `Спроба ${attempt} з 3`;
      attempt++;

      if (attempt > 3) {
        btn.disabled = true;
        btn.style.background = "#444";
        btn.style.cursor = "not-allowed";

        if (userTotal > compTotal) {
          resultElem.textContent = `${userName} переміг з ${userTotal} очками!`;
          resultElem.style.color = "#00e676";
        } else if (userTotal < compTotal) {
          resultElem.textContent = `Комп’ютер переміг з ${compTotal} очками!`;
          resultElem.style.color = "#ff5252";
        } else {
          resultElem.textContent = "Нічия!";
          resultElem.style.color = "#ffaa00";
        }
      }
    });
  </script>
</body>
</html>
